name: test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: moon setup
        uses: moonbitlang/setup-moonbit@v1.2.0

      - name: moon check
        run: |
          moon check --target all

      - name: moon build
        run: |
          moon build --target all

      - name: moon test
        run: |
          moon test --target all
      - name: strict warnings
        run: |
          moon check --deny-warn
          moon test --deny-warn

      - name: library example
        run: |
          moon run examples/basic
      - name: format and public API
        run: |
          moon fmt
          git diff --exit-code
          moon info
          git diff --exit-code
