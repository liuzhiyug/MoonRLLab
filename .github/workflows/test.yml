name: test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: moon setup
        uses: moonbitlang/setup-moonbit@v1.2.0

      - name: moon check
        run: |
          moon check

      - name: moon test
        run: |
          moon test
      - name: strict warnings
        run: |
          moon check --deny-warn
          moon test --deny-warn
      - name: format and public API
        run: |
          moon fmt
          git diff --exit-code
          moon info
          git diff --exit-code
