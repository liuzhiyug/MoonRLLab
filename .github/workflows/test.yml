name: test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: moon setup
        uses: moonbitlang/setup-moonbit@v1.2.0

      - name: moon check
        run: |
          moon check

      - name: moon test
        run: |
          moon test
